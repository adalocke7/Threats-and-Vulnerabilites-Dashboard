<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Threats and Vulnerabilities Dashboard</title>
        <link rel="stylesheet" href="{{ url_for ('static', filename='style.css') }}">
    </head>
    <body>
        <div class="dashboard-shell">
            <header class="page-header">
                <div>
                    <p class="eyebrow">Threat intelligence</p>
                    <h1>Dashboard</h1>
                </div>
                <span class="status-pill">Live scan</span>
            </header>

            <p class="subtitle">Click on a card to learn more</p>

            <div class="cards-container">
                {% for item in catalog %}
                    <article class="card">
                        <div class="card-header">
                            <h4>{{ item.name }}</h4>
                            <span class="category-tag">{{ item.category }}</span>
                        </div>

                        <p class="description">{{ item.description }}</p>

                        <div class="mitigation-box">
                            <span class="label">Mitigation</span>
                            <p>{{ item.mitigation }}</p>
                        </div>

                        {% if item.Simulation %}
                            <button type="button">Run simulation</button>
                        {% endif %}
                    </article>
                {% endfor %}
            </div>
        </div>
    </body>
</html>
